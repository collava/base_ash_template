name: Resolve security dependency updates
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "28.3"
          elixir-version: "1.20.5"
      - name: Resolve compatible security updates
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix help deps.unlock
          mix deps.unlock ash_admin ash_cloak ash_oban ash_phoenix hackney ssl_verify_fun jose lazy_html swoosh certifi cinder elixir_make fine h2 oban quic webtransport
          mix deps.get
          echo SECURITY_LOCK_BEGIN
          base64 -w 120 mix.lock
          echo SECURITY_LOCK_END
