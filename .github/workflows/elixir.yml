name: Elixir Validations
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  MIX_ENV: test
  CACHE_VERSION: 2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      fail-fast: false
      matrix:
        otp: ["27.3", "28.3"]
        elixir: ["1.19.4", "1.20.5"]
        include:
          # Elixir 1.19 supports OTP 26-28; OTP 29 requires Elixir 1.20.
          - otp: "29.1.2"
            elixir: "1.20.5"
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_base_template_test
        ports:
          - "5432:5432"
        options: "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}

      - name: Show toolchain versions
        run: elixir --version

      - name: Create PLT dir
        run: |
          if [ ! -d "priv/plts" ]; then
            mkdir priv/plts
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: static-${{ runner.os }}-${{ runner.arch }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ github.head_ref || github.ref }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            static-${{ runner.os }}-${{ runner.arch }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ github.head_ref || github.ref }}-
            static-${{ runner.os }}-${{ runner.arch }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-refs/heads/main-

      - name: Deps Get
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create database
        run: mix do ecto.create + ecto.migrate

      - name: Run Dialyzer
        run: mix dialyzer --plt priv/plts --format github

      - name: Unused dependencies
        run: mix deps.unlock --check-unused

      - name: Install tailwind for blog
        run: mix tailwind.install

      - name: Run CREDO
        run: mix credo diff --from-git-merge-base origin/main

      - name: Run Sobelow
        run: mix sobelow --config

      - name: Run COVERALLS
        run: mix coveralls.json

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Clean to rule out incremental build as a source of flakiness
        if: github.run_attempt != '1'
        run: |
          mix deps.clean --all
          mix clean
        shell: sh

  docker:
    name: Build and boot latest runtime release image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_base_template_test
        ports:
          - "5432:5432"
        options: "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build release image
        run: docker build --tag ash-base-template:ci .

      - name: Migrate and boot release image
        timeout-minutes: 3
        shell: bash
        run: |
          # These are isolated CI-only values, never production credentials.
          runtime_args=(
            --network host
            -e DATABASE_URL=ecto://postgres:postgres@127.0.0.1:5432/ash_base_template_test
            -e SECRET_KEY_BASE=ci-only-secret-key-base-01234567890123456789012345678901234567890123456789
            -e TOKEN_SIGNING_SECRET=ci-only-token-signing-secret-012345678901234567890123456789
            -e EMAIL_REPORTING_ADAPTER_API_KEY=ci-only-placeholder
            -e PHX_HOST=localhost
            -e PORT=4000
            -e ECTO_IPV6=false
          )

          timeout 90s docker run --rm "${runtime_args[@]}" \
            --entrypoint /app/bin/ash_base_template ash-base-template:ci eval \
            'Application.load(:ash_base_template); {:ok, _, _} = Ecto.Migrator.with_repo(AshBaseTemplate.Repo, &Ecto.Migrator.run(&1, :up, all: true))'

          docker run --detach --name release-smoke "${runtime_args[@]}" ash-base-template:ci
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' release-smoke)" != true ]; then
              echo "Release exited before becoming ready"
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4000/ >/dev/null; then
              echo "Release booted and served HTTP successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Release did not become ready within 60 seconds"
          exit 1

      - name: Show release logs and clean up
        if: always()
        run: |
          docker logs release-smoke 2>&1 || true
          docker rm --force release-smoke 2>/dev/null || true
